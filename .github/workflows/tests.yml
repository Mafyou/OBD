name: 🧪 OBD tests

run-name: >-
  ${{
    github.event_name == 'pull_request'
    && format('PR #{0} · tests', github.event.pull_request.number)
    || format('{0} · tests', github.ref_name)
  }}

# The unit, integration and functional tests of the library and of the view models of the app. The Android and iOS
# heads are not built here: the functional tests compile the view models from their sources.
on:
  push:
    branches: [main]
    paths:
      - 'src/Fronts/OBD.Mobile.Lib/**'
      - 'src/Fronts/OBD.Mobile/ViewModels/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Fronts/OBD.Mobile.Lib/**'
      - 'src/Fronts/OBD.Mobile/ViewModels/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '11.0.100'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: obd-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit, integration and functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-tests-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-tests-

      # OBD.Mobile.Lib is a MAUI library that also targets Android: its restore needs the workload, even for net11.0
      - name: 🧰 Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: 🧪 Unit tests
        run: dotnet test tests/OBD.Mobile.Lib.UnitTests/OBD.Mobile.Lib.UnitTests.csproj

      - name: 🔗 Integration tests
        run: dotnet test tests/OBD.Mobile.Lib.IntegrationTests/OBD.Mobile.Lib.IntegrationTests.csproj

      - name: 🚶 Functional tests
        run: dotnet test tests/OBD.Mobile.FunctionalTests/OBD.Mobile.FunctionalTests.csproj
